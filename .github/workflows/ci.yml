name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - gcc-profile
          - gcc-asan
          - gcc-ubsan
          - gcc-tsan
          - gcc-asan-ubsan
          - gcc-coverage
          - gcc-lto
          - gcc-fast-math
          - gcc-lto-fast-math
          - clang-debug
          - clang-release
          - clang-profile
          - clang-asan
          - clang-ubsan
          - clang-tsan
          - clang-msan
          - clang-asan-ubsan
          - clang-coverage
          - clang-lto
          - clang-fast-math
          - clang-lto-fast-math

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: bash
        run: |
          git config --file .gitmodules submodule.cmake.url https://github.com/pmontalb/CmakeUtilities.git
          git submodule sync -- cmake
          git submodule update --init --recursive cmake
          sed 's|"preset/|"cmake/preset/|g' cmake/CMakePresets.json > CMakePresets.json

      - name: Install compilers & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 clang-22 lld-22 llvm-22 ninja-build ccache libgtest-dev zlib1g-dev cmake
          sudo ln -sf /usr/bin/gcc-16 /usr/bin/gcc
          sudo ln -sf /usr/bin/g++-16 /usr/bin/g++
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/lld-22 /usr/bin/lld
          sudo ln -sf /usr/bin/llvm-ar-22 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-22 /usr/bin/llvm-ranlib
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          gcc --version
          clang++ --version
          cmake --version

      - name: Configure
        run: cmake -S . --preset=${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset=${{ matrix.preset }}

      - name: Test
        run: ctest --preset=${{ matrix.preset }} --output-on-failure

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - msvc-debug
          - msvc-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: bash
        run: |
          git config --file .gitmodules submodule.cmake.url https://github.com/pmontalb/CmakeUtilities.git
          git submodule sync -- cmake
          git submodule update --init --recursive cmake
          sed 's|"preset/|"cmake/preset/|g' cmake/CMakePresets.json > CMakePresets.json

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { throw "vcpkg root environment variable not found" }
          & "$vcpkgRoot\vcpkg.exe" install zlib:x64-windows-static-md gtest:x64-windows-static-md

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { $env:VCPKG_ROOT }
          cmake -S . --preset=${{ matrix.preset }} `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md"

      - name: Build
        shell: pwsh
        run: cmake --build --preset=${{ matrix.preset }}

      - name: Test
        shell: pwsh
        run: ctest --preset=${{ matrix.preset }} --output-on-failure
