name: Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: bash
        run: |
          git config --file .gitmodules submodule.cmake.url https://github.com/pmontalb/CmakeUtilities.git
          git submodule sync -- cmake
          git submodule update --init --recursive cmake
          cp -f cmake/CMakePresets.json .
          cp -rf cmake/preset .

      - name: Install compilers & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 ninja-build ccache libgtest-dev zlib1g-dev cmake gcovr
          sudo ln -sf /usr/bin/gcc-16 /usr/bin/gcc
          sudo ln -sf /usr/bin/g++-16 /usr/bin/g++

      - name: Configure
        run: cmake -S . --preset=gcc-coverage

      - name: Build
        run: cmake --build --preset=gcc-coverage

      - name: Test
        run: ctest --preset=gcc-coverage --output-on-failure

      - name: Coverage report
        shell: bash
        run: |
          mkdir -p cmake-build-gcc-coverage/Coverage
          gcovr -r . cmake-build-gcc-coverage \
            --xml-pretty -o coverage.xml \
            --exclude-directories='.*cnpy.*' \
            --exclude-directories='.*UnitTests.*' \
            --exclude-directories='.*cmake.*' \
            --exclude-unreachable-branches \
            --exclude-throw-branches \
            --gcov-executable=gcov-16 \
            -s

      - name: Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          name: Unit Tests
          fail_ci_if_error: false
          verbose: true
